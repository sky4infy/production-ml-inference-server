global:
  scrape_interval: 15s       # scrape /metrics every 15 seconds
  evaluation_interval: 15s   # evaluate alert rules every 15 seconds

scrape_configs:
  - job_name: "ml-inference-server"
    static_configs:
      # Phase 7: the server runs in Docker now, so this is the compose service
      # name resolved over the shared network. Before phase 7 the app was on the
      # host and this had to be host.docker.internal:8000 — a workaround for the
      # split deployment, not something Prometheus needed.
      #
      # If you go back to running uvicorn on the host (e.g. `uvicorn
      # app.main:app --reload` for a fast edit loop) while keeping Prometheus in
      # Docker, swap the target for the commented line below. localhost is wrong
      # in both cases: inside a container it means the container.
      - targets: ["app:8000"]
      # - targets: ["host.docker.internal:8000"]   # app running on the host
    metrics_path: "/metrics"
